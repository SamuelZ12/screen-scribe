name: Verify release source

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        run: scripts/select-latest-stable-xcode.sh
      - name: Run standalone regression checks
        run: scripts/run-standalone-tests.sh
      - name: Verify Release source builds
        run: |
          xcodebuild -project ScreenScribe.xcodeproj -scheme ScreenScribe \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" build
      # Release assets are packaged and verified on the maintainer's Mac.
      # CI has no signing identity and cannot replace published assets.
