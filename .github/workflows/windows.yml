name: Windows build and native acceptance
on:
  push:
    branches: ['codex/windows-v0.1']
    paths:
      - 'ScreenScribe-Windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'ScreenScribe-Windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ScreenScribe-Windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ScreenScribe-Windows/package-lock.json
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Native Windows DPAPI, renderer, shortcut and public-fixture crop
        run: npx electron . --platform-self-test
      - name: Preserve native result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP/ScreenScribe-Windows-self-test.json") {
            New-Item artifacts -ItemType Directory -Force | Out-Null
            Copy-Item "$env:TEMP/ScreenScribe-Windows-self-test.json" artifacts/native-windows-self-test.json
          }
      - run: npm run dist:win
      - run: node scripts/verify-package.cjs
      - name: Install and test packaged Windows application
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Missing installer' }
          $target = Join-Path $env:RUNNER_TEMP 'ScreenScribe-Installed-Acceptance'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $target 'ScreenScribe.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Installed executable missing' }
          $report = Join-Path $env:TEMP 'ScreenScribe-Windows-self-test.json'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $native = Start-Process -FilePath $exe -ArgumentList '--platform-self-test' -Wait -PassThru
          if (Test-Path -LiteralPath $report) { Copy-Item -LiteralPath $report artifacts/installed-windows-self-test.json }
          if ($native.ExitCode -ne 0) { throw 'Installed native checks failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.platform -ne 'win32') { throw 'No native Windows evidence' }
      - name: Uninstall isolated acceptance copy
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:RUNNER_TEMP 'ScreenScribe-Installed-Acceptance/Uninstall ScreenScribe.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScreenScribe-Windows-x64
          path: |
            ScreenScribe-Windows/dist/*Setup.exe
            ScreenScribe-Windows/artifacts/*.json
          if-no-files-found: error
